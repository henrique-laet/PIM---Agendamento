<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitaCare — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body d-flex align-items-center justify-content-center">

    <div class="login-card card shadow-lg p-5">
        <div class="text-center mb-4">
            <img src="logo.svg" alt="VitaCare" style="height: 70px; margin-top: 8px;">
            <p class="text-muted mt-2">Sistema de Agendamento Médico</p>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">E-mail</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" placeholder="seu@email.com">
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold">Senha</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" placeholder="••••••••">
                <button class="btn btn-outline-secondary" id="btnVerSenha" type="button">
                    <i class="bi bi-eye"></i>
                </button>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="lembrar">
                <label class="form-check-label" for="lembrar">Lembrar de mim</label>
            </div>
            <a href="#" class="text-primary text-decoration-none">Esqueci a senha</a>
        </div>

        <a href="index.html" class="btn btn-primary w-100 py-2 fw-bold btn-login">
            <i class="bi bi-box-arrow-in-right"></i> Entrar
        </a>

        <p class="text-center text-muted mt-4 mb-0">
            © 2025 VitaCare
        </p>
    </div>

    <!-- VLibras -->
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>new window.VLibras.Widget('https://vlibras.gov.br/app');</script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Mostrar/esconder senha
        document.getElementById('btnVerSenha').addEventListener('click', function() {
            const input = document.querySelector('input[type="password"], input[type="text"]');
            const icon = this.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        });
    </script>
</body>
</html>
